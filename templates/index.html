<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .contenedor {
            max-width: 700px;
        }

        h2 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.08);
            background: #f0f0f0;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi Web</h1>

        <nav>
            <a href="/">Inicio</a>
            <a href="/about">Sobre mí</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <div class="contenedor">
            <h2>¡Hola! 👋</h2>

            <p>
                Bienvenido a mi primera página web.
                Aquí puedes poner información sobre ti,
                tu proyecto o tu negocio.
            </p>

            <!-- Botón que lleva a /about -->
            <a href="/about" class="boton">Comenzar</a>
        </div>
    </main>

    <footer>
        © 2026 Mi Página Web
    </footer>

</body>
</html>
